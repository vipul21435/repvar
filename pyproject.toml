[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repvar"
version = "0.1.0"
description = "Separate item variance from rerun variance in repeated benchmark runs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Vipul Raj Jha" }]
keywords = [
    "evaluation",
    "benchmark",
    "variance components",
    "generalizability theory",
    "intraclass correlation",
    "repeated runs",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.23", "scipy>=1.9"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "statsmodels>=0.14",
    "matplotlib>=3.6",
]

[project.scripts]
repvar = "repvar.cli:main"

[project.urls]
Homepage = "https://github.com/vipul21435/repvar"

[tool.hatch.build.targets.wheel]
packages = ["src/repvar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
